[workspace]
members = [
    "crates/jfl-core",
    "crates/jfl-hal",
    "crates/jfl-gcs",
    "crates/jfl-sim",
    "tools/key_provisioner",
    "tools/link_analyzer",
]
# The fuzz crate is a libFuzzer target (#![no_main] + sanitizer runtime); it is
# built only via `cargo fuzz` on nightly, so it is excluded from the normal
# workspace build/test.
exclude = ["tools/fuzz"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
