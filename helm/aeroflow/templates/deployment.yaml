apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aeroflow.fullname" . }}
  labels:
    {{- include "aeroflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aeroflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "aeroflow.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aeroflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AEROFLOW_DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "aeroflow.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            - name: AEROFLOW_WORKSPACE_DIR
              value: "{{ .Values.aeroflow.workspaceDir }}"
            - name: AEROFLOW_MAX_CONCURRENT_CASES
              value: "{{ .Values.aeroflow.maxConcurrentCases }}"
            - name: AEROFLOW_ALLOW_REGISTRATION
              value: "{{ .Values.aeroflow.allowRegistration }}"
            - name: AEROFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aeroflow.fullname" . }}-jwt
                  key: secret
            - name: RUST_LOG
              value: "{{ .Values.aeroflow.logLevel }}"
            - name: RUST_BACKTRACE
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
