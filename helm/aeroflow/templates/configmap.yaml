apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aeroflow.fullname" . }}
  labels:
    {{- include "aeroflow.labels" . | nindent 4 }}
data:
  aeroflow-settings.toml: |
    workspace_dir = "{{ .Values.aeroflow.workspaceDir }}"
    max_concurrent_cases = {{ .Values.aeroflow.maxConcurrentCases }}
    allow_registration = {{ .Values.aeroflow.allowRegistration }}
    database_url = "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "aeroflow.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
